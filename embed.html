<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · R6T5 合作伙伴</title>
<style>
:root{--bg:#ffffff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--accent:#2563eb;--accent-soft:rgba(37,99,235,.1);--ok:#1f7a4d}
*{box-sizing:border-box}
body{margin:0;font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:18px}
.box{width:100%;max-width:360px}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:14px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;color:var(--text)}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;font-size:13px;font-family:inherit}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.go{width:100%;padding:10px;border:none;border-radius:8px;background:var(--ok);color:#fff;font-size:13.5px;cursor:pointer}
.go:disabled{opacity:.6}
.or{display:flex;align-items:center;gap:10px;margin:14px 0 12px}
.or i{flex:1;height:1px;background:var(--line)}
.or span{font-size:12px;color:#8a939e}
.hub{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);font-size:13px;cursor:pointer}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.msg{font-size:12.5px;min-height:18px;margin-top:8px;color:#b03030}
.ok{color:var(--ok)}
.block{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px;text-align:center;line-height:1.8}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="brand"><span class="dot"></span><span id="appName">加载中…</span></div>
  <div id="ui">
    <div class="tabs"><button id="tabLogin" class="on">登录</button><button id="tabSignup">注册</button></div>
    <input id="email" placeholder="邮箱" autocomplete="username">
    <input id="pw" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password">
    <button class="go" id="go">登录</button>
    <div class="msg" id="msg"></div>
    <div class="or"><i></i><span>或</span><i></i></div>
    <button class="hub" id="hub">R6T5 Hub 通行证登录</button>
    <div class="note">用 R6T5 Hub 账号登录，与本站邮箱账号相互独立。</div>
  </div>
</div>
<script>
(function () {
  var INTL = 'https://fckqmlwkujixwztzqqni.supabase.co';
  var INTL_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZja3FtbHdrdWppeHd6dHpxcW5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMjkzODksImV4cCI6MjEwNTkwNTM4OX0.W6FHJ-CgNNuCO9xEcrNuLj2y6-1D6Gyy72D0oGmA7Xw';
  var appId = new URLSearchParams(location.search).get('app') || '';
  var $ = function (id) { return document.getElementById(id); };
  var mode = 'login', cfg = null;

  function fail(text) {
    $('ui').innerHTML = '<div class="block">' + text + '</div>';
  }

  async function rest(path, key) {
    var r = await fetch(INTL + '/rest/v1/' + path, { headers: { apikey: INTL_ANON, Authorization: 'Bearer ' + (key || INTL_ANON) } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  }

  async function boot() {
    if (!appId) { fail('缺少 app 参数'); return; }
    try {
      var apps = await rest('partner_app?select=*&id=eq.' + encodeURIComponent(appId));
      if (!apps || !apps.length) { fail('应用不存在或已被删除'); return; }
      var app = apps[0];
      var binds = await rest('partner_supabase?select=*&partner_id=eq.' + encodeURIComponent(app.partner_id) + '&embed_enabled=eq.true');
      if (!binds || !binds.length) {
        fail('该应用的嵌入组件尚未开通<br><span style="font-size:12px">站长需要在合作伙伴控制台完成 Supabase 绑定与专业版授权</span>');
        return;
      }
      cfg = binds[0];
      $('appName').textContent = (app.emoji || '') + ' ' + (app.name || '登录');
      document.title = '登录 · ' + (app.name || '');
    } catch (e) {
      fail('加载配置失败：' + e.message);
    }
  }

  function setMode(m) {
    mode = m;
    $('go').textContent = m === 'login' ? '登录' : '注册';
    $('tabLogin').classList.toggle('on', m === 'login');
    $('tabSignup').classList.toggle('on', m === 'signup');
    $('pw').placeholder = m === 'login' ? '密码' : '密码（至少 6 位）';
  }

  async function submit() {
    if (!cfg) return;
    var email = $('email').value.trim();
    var pw = $('pw').value.trim();
    var msg = $('msg');
    msg.textContent = '';
    if (!email || !pw) { msg.textContent = '请填写邮箱和密码'; return; }
    $('go').disabled = true;
    try {
      var url = cfg.url.replace(/\/$/, '') + '/auth/v1/' + (mode === 'login' ? 'token?grant_type=password' : 'signup');
      var r = await fetch(url, {
        method: 'POST',
        headers: { apikey: cfg.anon_key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: pw }),
      });
      var d = await r.json().catch(function () { return {}; });
      if (!r.ok) throw new Error(d.msg || d.error_description || d.message || ('HTTP ' + r.status));
      if (mode === 'signup' && !(d.access_token || (d.session && d.session.access_token))) {
        msg.className = 'msg ok';
        msg.textContent = '注册成功，请到邮箱确认后再登录。';
        return;
      }
      var sess = d.session || d;
      post({
        type: 'r6t5:auth',
        app: appId,
        access_token: sess.access_token,
        refresh_token: sess.refresh_token,
        user: sess.user,
      });
      msg.className = 'msg ok';
      msg.textContent = '登录成功，已通知宿主页面。';
    } catch (e) {
      msg.className = 'msg';
      msg.textContent = e.message || '登录失败';
    } finally {
      $('go').disabled = false;
    }
  }

  function post(payload) {
    try {
      if (window.parent && window.parent !== window) window.parent.postMessage(payload, '*');
    } catch (e) {}
  }

  $('tabLogin').onclick = function () { setMode('login'); };
  $('tabSignup').onclick = function () { setMode('signup'); };
  $('go').onclick = submit;
  $('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  $('hub').onclick = function () {
    // 优先 ?host=，其次 referrer；回跳地址必须是 *.r6t5.dpdns.org，否则回伙伴站
    var host = new URLSearchParams(location.search).get('host') || document.referrer || '';
    var ret = /^https:\/\/[a-z0-9-]+\.r6t5\.dpdns\.org/i.test(host)
      ? host : 'https://partner.r6t5.dpdns.org';
    var url = 'https://myacc.r6t5.dpdns.org/?app=open-platform&country=cf&return=' + encodeURIComponent(ret);
    window.open(url, '_blank', 'noopener');
  };
  boot();
})();
</script>
</body>
</html>
